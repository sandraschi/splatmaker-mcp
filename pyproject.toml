[project]
name = "splatmaker-mcp"
version = "0.1.0"
description = "Self-hosted FOSS Gaussian-splat generation MCP — worldlabs-mcp alternative, zero marginal cost, local 4090 inference"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0,<4",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
splatmaker-mcp = "splatmaker_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splatmaker_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
