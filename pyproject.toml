[project]
name = "splatmaker-mcp"
version = "0.2.0"
description = "Self-hosted FOSS Gaussian-splat generation MCP — worldlabs-mcp alternative, zero marginal cost, local 4090 inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Floor pinned per fleet doctrine (JUNE_2026_STANDARDS_BAR.md): 3.2.0 is a
    # deliberate low floor for compat, NOT the target version. uv resolves to
    # whatever is latest <4.0 at sync time - verified 2026-07-13 this correctly
    # resolves to 3.4.4 (current PyPI SOTA), not 3.2.0. Do not "fix" this by
    # bumping the floor number; check PyPI if you want to know the real current
    # version, don't trust this string as a version report.
    "fastmcp>=3.4.4,<4",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.0,<0.17",
]
engine = [
    # Nerfstudio pulls gsplat as its rasterization backend automatically -
    # DECIDED 2026-07-13 (see README.md "Engine status"): Nerfstudio over
    # bare gsplat (too much DIY glue) and Postshot (scratched - paid CLI
    # behind a free download, bait-and-switch shaped).
    "torch>=2.4",
    "torchvision",
    "nerfstudio>=1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project.scripts]
splatmaker-mcp = "splatmaker_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splatmaker_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]
[tool.uv]
# nerfstudio's dependency tree pulls in newrawpy, which only has pre-release
# versions satisfying nerfstudio's constraint as of 2026-07-13 - found this
# via a real failed `uv sync`, not guessed.
prerelease = "allow"

[tool.pytest.ini_options]
asyncio_mode = "auto"
