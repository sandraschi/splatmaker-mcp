[project]
name = "splatmaker-mcp"
version = "0.4.0"
description = "Self-hosted FOSS Gaussian-splat generation MCP - worldlabs-mcp alternative, zero marginal cost, local inference"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "pydantic>=2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/splatmaker_mcp"]
